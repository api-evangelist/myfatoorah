aid: myfatoorah
url: https://raw.githubusercontent.com/api-evangelist/myfatoorah/refs/heads/main/apis.yml
name: MyFatoorah
kind: company
description: MyFatoorah is a Kuwait-based online payment gateway and invoicing platform
  serving merchants across the GCC and wider MENA region (Kuwait, Saudi Arabia, UAE,
  Qatar, Egypt, Bahrain, Oman, and Jordan). Its REST API lets businesses create
  invoices and payment links, execute and direct-charge card payments, run embedded
  checkout sessions, issue refunds, manage recurring payments, onboard marketplace
  suppliers, calculate shipping, and receive webhook notifications. MyFatoorah
  aggregates regional and international payment methods including KNET, mada,
  Benefit, Meeza, OmanNet, Visa, Mastercard, American Express, Apple Pay, Google
  Pay, and STC Pay. The API is region-scoped - a shared test host plus per-country
  live hosts - and authenticated with a Bearer API token.
