description: >-
  FinOps view of MyFatoorah spend. MyFatoorah is a payment aggregator, so the
  cost model is not API-usage billing but per-transaction processing fees deducted
  from settlements. The dominant, and often only, cost is the processing fee taken
  on each successful collection, which varies by payment method (KNET, mada,
  Benefit, Meeza, OmanNet, Visa, Mastercard, Amex, Apple Pay, Google Pay, STC Pay)
  and by country (Kuwait, Saudi Arabia, UAE, Qatar, Egypt, Bahrain, Oman, Jordan).
  Refunds may return or retain the service charge depending on the
  ServiceChargeOnCustomer flag, and marketplace flows split fees across suppliers.
  There is no charge for the REST API itself.
notes: >-
  Per-method, per-country rates are not reconciled here and are set in each
  merchant's agreement (negotiable by volume). Representative public figures cite
  ~2% KNET and ~3.5% international cards in Kuwait. Model your effective take rate
  from your own settlement reports, not from list rates.
