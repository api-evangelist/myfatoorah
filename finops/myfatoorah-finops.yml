meters:
- name: transaction_fee
  description: Processing fee taken on each successful collection, by payment method and country.
  unit: transaction
  aggregation: sum
  dimensions:
  - country
  - payment_method
  - currency
- name: refund_service_charge
  description: Service charge behavior on refunds, governed by the ServiceChargeOnCustomer flag.
  unit: transaction
  aggregation: sum
  dimensions:
  - country
  - payment_method
- name: supplier_commission
  description: Marketplace commission apportioned across suppliers on split settlements.
  unit: transaction
  aggregation: sum
  dimensions:
  - supplier
  - payment_method
principles:
- name: Visibility
  description: Track effective take rate per country and payment method from settlement/webhook data rather than list rates.
- name: Allocation
  description: Tag transactions by country, method, and supplier so processing fees map to products and cost centers.
- name: Optimization
  description: Route customers toward lower-fee local schemes (KNET, mada, Benefit) where suitable, and negotiate volume rates.
- name: Accountability
  description: Reconcile monthly settlements against expected fees; review refund service-charge handling per policy.
